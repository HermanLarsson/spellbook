[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spellbook"
version = "0.1.0"
description = "Autocomplete and spell checker built on hand-written data structures"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
